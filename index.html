<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registros | Águas do Piauí</title>
<style>
:root{--azul:#1E2FBF;--azul-esc:#16238F;--azul-cl:#EEF0FC;--txt:#1B1F3B;--cinza:#6B7090;--borda:#D9DCEE;--ok:#1B7F4B;--erro:#B3261E;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Quicksand","Segoe UI",system-ui,sans-serif;color:var(--txt);background:var(--bg);line-height:1.45}
header{padding:20px 16px 8px;text-align:center}
header img{height:84px;max-width:70%;object-fit:contain}
main{max-width:560px;margin:0 auto;padding:8px 16px 48px}
h1{font-size:1.25rem;margin:8px 0 14px;color:var(--azul);text-align:center}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.tab{border:2px solid var(--borda);background:#fff;color:var(--azul);border-radius:14px;padding:12px 6px;font:700 .9rem inherit;font-family:inherit;cursor:pointer}
.tab[aria-selected=true]{background:var(--azul);border-color:var(--azul);color:#fff}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #8B96FF;outline-offset:2px}
label,.lab{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}
input[type=text],input[type=email],input[type=date],input[type=time]{width:100%;padding:12px;border:2px solid var(--borda);border-radius:12px;font:inherit;font-size:1rem;background:#fff;color:var(--txt)}
input:focus{border-color:var(--azul)}
input[readonly]{background:var(--azul-cl);color:var(--azul-esc);font-weight:700}
.ok{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ok label{margin:0;border:2px solid var(--borda);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-weight:700}
.ok input{position:absolute;opacity:0}
.ok label:has(input:checked){background:var(--azul);border-color:var(--azul);color:#fff}
.ok label:has(input:focus-visible){outline:3px solid #8B96FF}
.inv{border-color:var(--erro)!important}
.keep{display:flex;gap:10px;align-items:center;margin:20px 0 4px;font-weight:600}
.keep input{width:20px;height:20px;accent-color:var(--azul)}
.btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--azul);color:#fff;font:800 1rem inherit;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.sec{background:var(--azul-cl);color:var(--azul)}
.msg{margin-top:12px;padding:12px;border-radius:12px;font-weight:700;display:none}
.msg.s{display:block;background:#E6F4EC;color:var(--ok)}
.msg.e{display:block;background:#FCEBEA;color:var(--erro)}
h2{font-size:1.05rem;margin:32px 0 4px;color:var(--azul)}
.sub{color:var(--cinza);font-size:.85rem;margin:0 0 12px}
.rec{border:2px solid var(--borda);border-radius:14px;padding:12px;margin-bottom:10px}
.rec.cp{border-color:#B9E0C9}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 10px;font-size:.9rem}
.rec dt{color:var(--cinza)}.rec dd{margin:0;font-weight:700;word-break:break-word}
.row{display:flex;gap:8px}
.row button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--borda);background:#fff;font:700 .9rem inherit;font-family:inherit;cursor:pointer;color:var(--azul)}
.row .del{color:var(--erro);flex:0 0 auto}
.tag{font-size:.75rem;color:var(--ok);font-weight:800}
.vazio{color:var(--cinza);text-align:center;padding:16px}
@media (prefers-reduced-motion:no-preference){.msg{transition:opacity .2s}}
</style>
</head>

<main>
<h1>Registro de dados</h1>
<div class="tabs" role="tablist" id="tabs"></div>
<form id="form" novalidate></form>
<div id="msg" class="msg" role="status"></div>

<h2 id="hTit">Registros salvos</h2>
<p class="sub">Ficam guardados neste aparelho, mesmo sem internet. Copie e cole na planilha real.</p>
<button class="btn sec" id="copyAll" type="button">Copiar todos para o Excel</button>
<div id="lista" style="margin-top:12px"></div>
</main>

<script>
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const T={
 geradores:{nome:'Geradores',cols:[
  {k:'Data',t:'date'},{k:'Hora',t:'time'},{k:'Litros',t:'num'},{k:'Valor',t:'money'}]},
 horarios:{nome:'Horários',cols:[
  {k:'Horário de início',t:'time'},{k:'Equipe',t:'text'},{k:'Data',t:'date'}]},
 fotos:{nome:'Análise de fotos',cols:[
  {k:'Email',t:'email'},{k:'Nome',t:'text'},{k:'Protocolo',t:'text'},{k:'Base',t:'text'},{k:'Cidade',t:'text'},
  {k:'Data do serviço',t:'date'},{k:'Mês',t:'mes'},{k:'Equipe',t:'text'},{k:'Serviços',t:'text'},
  {k:'Fotos',t:'ok'},{k:'Pergunta',t:'ok'}]}
};
const KEY='forms_aegea_v1';
let tipo=null,busy=false;
const $=s=>document.querySelector(s);
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
const fData=v=>{const[a,m,d]=v.split('-');return `${d}/${m}/${a}`};
const num=s=>{s=s.replace(/R\$|\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'');s=s.replace(',','.');return /^\d+(\.\d+)?$/.test(s)?Number(s):NaN};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const idf=(c,i)=>'f'+i;

function tabs(){
 $('#tabs').innerHTML=Object.entries(T).map(([k,v])=>`<button type="button" role="tab" class="tab" data-k="${k}" aria-selected="${k===tipo}">${v.nome}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tipo=b.dataset.k;sessionStorage.setItem('tipo',tipo);$('#msg').className='msg';tabs();form();lista()});
}
function form(){
 const f=$('#form');
 if(!tipo){f.innerHTML='<p class="vazio">Escolha acima o tipo de registro.</p>';$('#hTit').style.display='none';return}
 f.innerHTML=T[tipo].cols.map((c,i)=>{
  const id=idf(c,i);
  if(c.t==='ok')return `<div class="lab" id="l${id}">${c.k}</div><div class="ok" data-i="${i}" role="radiogroup" aria-labelledby="l${id}"><label><input type="radio" name="${id}" value="conforme"> FOTOS OK</label><label><input type="radio" name="${id}" value="não conforme"> NÃO SEGUIU O CHECKLIST</label></div>`;
  if(c.t==='mes')return `<label for="${id}">${c.k} (automático)</label><input id="${id}" type="text" readonly placeholder="Preenchido pela data do serviço">`;
  const ty={date:'date',time:'time',email:'email'}[c.t]||'text';
  const im=c.t==='num'||c.t==='money'?' inputmode="decimal"':'';
  const ph=c.t==='money'?' placeholder="100,00"':c.t==='num'?' placeholder="50,5"':'';
  return `<label for="${id}">${c.k}</label><input id="${id}" type="${ty}"${im}${ph} autocomplete="off">`;
 }).join('')+`<label class="keep"><input type="checkbox" id="keep"> Manter os dados preenchidos após salvar</label><button class="btn" id="go" type="submit">Salvar registro</button>`;
 const iD=T[tipo].cols.findIndex(c=>c.t==='mes');
 if(iD>=0){const di=T[tipo].cols.findIndex(c=>c.k==='Data do serviço');
  $('#f'+di).addEventListener('input',e=>{const v=e.target.value;$('#f'+iD).value=v?MESES[+v.split('-')[1]-1]:''})}
 $('#hTit').style.display='';
}
function msg(t,c){const m=$('#msg');m.textContent=t;m.className='msg '+c}
$('#form').addEventListener('submit',e=>{
 e.preventDefault();if(busy||!tipo)return;busy=true;$('#go').disabled=true;
 setTimeout(()=>{busy=false;const b=$('#go');if(b)b.disabled=false},800);
 const cols=T[tipo].cols,vals=[];let bad=false,erroTxt='Preencha todos os campos obrigatórios.';
 cols.forEach((c,i)=>{
  const id=idf(c,i);let v;
  if(c.t==='ok'){const r=document.querySelector(`input[name="${id}"]:checked`);v=r?r.value:'';document.querySelector(`.ok[data-i="${i}"]`).classList.toggle('inv',!v)}
  else{const el=$('#'+id);v=el.value.trim();el.classList.toggle('inv',!v)}
  if(!v){bad=true;vals.push('');return}
  if(c.t==='date')v=fData(v);
  if(c.t==='num'){const n=num(v);if(isNaN(n)){bad=true;erroTxt='Litros: digite um número, como 50,5.';$('#'+id).classList.add('inv');vals.push('');return}v=n.toLocaleString('pt-BR',{maximumFractionDigits:2})}
  if(c.t==='money'){const n=num(v);if(isNaN(n)){bad=true;erroTxt='Valor: digite um número, como 100,00.';$('#'+id).classList.add('inv');vals.push('');return}v='R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
  if(c.t==='email'&&!/^\S+@\S+\.\S+$/.test(v)){bad=true;erroTxt='Email inválido.';$('#'+id).classList.add('inv');vals.push('');return}
  vals.push(v);
 });
 if(bad){msg(erroTxt,'e');return}
 const all=load(),sig=vals.join('|');
 if(all.some(r=>r.tipo===tipo&&r.vals.join('|')===sig)){msg('Este registro já foi salvo. Nada foi duplicado.','e');return}
 all.unshift({id:Date.now(),tipo,vals,copiado:false});save(all);
 msg('Registro salvo neste aparelho.','s');
 if(!$('#keep').checked){$('#form').reset();document.querySelectorAll('.inv').forEach(x=>x.classList.remove('inv'))}
 lista();
});
function copiar(txt){
 const fb=()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok};
 if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(txt).then(()=>true).catch(()=>fb());
 return Promise.resolve(fb());
}
function lista(){
 const L=$('#lista');if(!tipo){L.innerHTML='';$('#copyAll').style.display='none';return}
 const rs=load().filter(r=>r.tipo===tipo),cols=T[tipo].cols;
 $('#copyAll').style.display=rs.length?'':'none';
 L.innerHTML=rs.length?rs.map(r=>`<div class="rec ${r.copiado?'cp':''}"><dl>${cols.map((c,i)=>`<dt>${c.k}</dt><dd>${esc(r.vals[i])}</dd>`).join('')}</dl>${r.copiado?'<div class="tag">Já copiado</div>':''}<div class="row"><button type="button" data-a="c" data-id="${r.id}">Copiar linha</button><button type="button" class="del" data-a="d" data-id="${r.id}">Excluir</button></div></div>`).join(''):'<p class="vazio">Nenhum registro salvo neste tipo.</p>';
}
$('#lista').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const id=+b.dataset.id;let all=load();
 if(b.dataset.a==='d'){if(confirm('Excluir este registro?')){all=all.filter(r=>r.id!==id);save(all);lista()}return}
 const r=all.find(x=>x.id===id);copiar(r.vals.join('\t')).then(ok=>{if(ok){r.copiado=true;save(all);lista();msg('Linha copiada. Cole na primeira célula da linha vazia do Excel.','s')}else msg('Não foi possível copiar.','e')});
});
$('#copyAll').addEventListener('click',()=>{
 const all=load(),rs=all.filter(r=>r.tipo===tipo).reverse();
 copiar(rs.map(r=>r.vals.join('\t')).join('\n')).then(ok=>{if(ok){rs.forEach(r=>r.copiado=true);save(all);lista();msg(rs.length+' linha(s) copiada(s), da mais antiga para a mais recente.','s')}else msg('Não foi possível copiar.','e')});
});
tipo=sessionStorage.getItem('tipo');tabs();form();lista();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
